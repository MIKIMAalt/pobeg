<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ночной побег">
<style>
html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #0b0e1c; color-scheme: dark; }
body { margin: 0; }
</style>
<title>Ночной побег</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: pseudo-3D three-lane road on a canvas; DOM layers on top (HUD while running; home / shop / cases / settings screens; pause, game-over and case-reveal cards). Single night-city look with police-light red and blue accents, by choice. */
:root {
  --bg: #0b0e1c;
  --panel: rgba(14, 18, 38, 0.94);
  --solid: #11162e;
  --line: rgba(255, 255, 255, 0.1);
  --fill: rgba(255, 255, 255, 0.06);
  --ink: #f2f4ff;
  --dim: #8d94b5;
  --accent: #ffd23f;
  --on-accent: #241a00;
  --red: #ff3b4e;
  --blue: #3b82ff;
  --gem: #52e5ff;
  --coin: #ffc928;
  --r0: #9aa3c7;
  --r1: #4da3ff;
  --r2: #b66bff;
  --r3: #ffb02e;
  --display: "Russo One", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior: none; }
body {
  margin: 0;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#stage { position: relative; height: 100%; background: var(--bg); overflow: hidden; }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.dot { display: inline-block; width: 14px; height: 14px; flex: none; }
.dot.coin { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, var(--coin) 55%, #c98a00); }
.dot.gem { background: linear-gradient(135deg, #c9f6ff, var(--gem) 50%, #1c9bd1); clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%); }
.cur { display: flex; gap: 8px; }
.cn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; background: var(--fill); border: 1px solid var(--line); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }

/* HUD */
.hud {
  position: absolute; top: 10px; left: 0; right: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hud-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.hud-row > * { min-width: 0; }
.h-score { font-family: var(--display); font-size: clamp(34px, 11vw, 48px); line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0,0,0,0.35); }
.h-score small { font-size: 0.4em; margin-left: 4px; color: var(--dim); }
.h-best { margin-top: 4px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.pausebtn { pointer-events: auto; width: 44px; height: 44px; border-radius: 14px; background: var(--fill); border: 1px solid var(--line); display: grid; place-items: center; padding: 0; }
.pausebtn i { display: block; width: 14px; height: 16px; border-left: 4px solid var(--ink); border-right: 4px solid var(--ink); box-sizing: border-box; }
.hud-cur { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.danger { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
.danger span { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); flex: none; }
.danger div { flex: 1; height: 8px; border-radius: 99px; background: rgba(255,255,255,0.1); overflow: hidden; }
.danger i { display: block; height: 100%; width: 100%; background: var(--gem); border-radius: 99px; }
.fx { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.fxchip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px 5px 7px; border-radius: 99px; background: rgba(255, 210, 63, 0.16); border: 1px solid rgba(255, 210, 63, 0.4); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.fxchip .ico { width: 14px; height: 14px; color: var(--accent); }

.ico { display: inline-block; width: 22px; height: 22px; }
.ico svg { width: 100%; height: 100%; display: block; }
.x2 { font-family: var(--display); font-size: 0.85em; line-height: 1; display: grid; place-items: center; width: 100%; height: 100%; }

/* screens */
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding-top: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.screen.sub { background: var(--panel); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.titleblock { margin-top: 14px; }
.titleblock h1 { font-family: var(--display); font-size: clamp(34px, 11.5vw, 52px); line-height: 0.98; margin: 0; letter-spacing: 0.01em; text-wrap: balance; text-shadow: 0 3px 0 rgba(0,0,0,0.4); }
.titleblock h1 em { font-style: normal; color: var(--accent); }
.titleblock p { margin: 8px 0 0; color: var(--dim); font-size: 14px; font-weight: 700; }
.gift {
  margin-top: 12px; align-self: flex-start;
  background: linear-gradient(90deg, rgba(255,210,63,0.2), rgba(255,210,63,0.08));
  border: 1px solid rgba(255,210,63,0.5); border-radius: 999px; padding: 9px 16px;
  font-weight: 800; font-size: 13px;
}
.spacer { flex: 1; }
.bottom { padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.bottom > * { width: 100%; max-width: 420px; }
.boostrow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; min-height: 44px; align-items: center; }
.boostrow .hintline { color: var(--dim); font-size: 13px; font-weight: 700; text-align: center; }
.bchip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border-radius: 14px; background: var(--fill); border: 1.5px solid var(--line); font-weight: 800; font-size: 13px; }
.bchip .ico { width: 20px; height: 20px; color: var(--dim); }
.bchip[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,210,63,0.14); }
.bchip[aria-pressed="true"] .ico { color: var(--accent); }
.play {
  border: 0; border-radius: 20px; padding: 19px 20px;
  background: var(--accent); color: var(--on-accent);
  font-family: var(--display); font-size: 26px; letter-spacing: 0.04em;
  box-shadow: 0 5px 0 #b8901a, 0 14px 30px rgba(255, 210, 63, 0.25);
}
.play:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8901a; }
.navrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.navbtn { padding: 14px 6px; border-radius: 16px; background: var(--fill); border: 1px solid var(--line); font-weight: 800; font-size: 14px; position: relative; }
.navbtn.hot::after { content: ""; position: absolute; top: 8px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }

.sub .head { display: flex; align-items: center; gap: 10px; }
.back { background: var(--fill); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-weight: 800; font-size: 14px; flex: none; }
.sub h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; flex: 1; min-width: 0; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; padding-block: 16px calc(20px + env(safe-area-inset-bottom, 0px)); margin-inline: -4px; padding-inline: 4px; }
.inner { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.label { margin: 0 0 10px; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.list { display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--fill); border: 1px solid var(--line); }
.row .ico { width: 44px; height: 44px; padding: 10px; box-sizing: border-box; border-radius: 12px; background: rgba(255,255,255,0.07); color: var(--accent); }
.row b { font-size: 15px; display: block; }
.row small { color: var(--dim); font-size: 12px; line-height: 1.35; display: block; margin-top: 2px; }
.row small u { text-decoration: none; color: var(--ink); font-weight: 800; }
.btn { border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 800; font-size: 13px; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn.alt { background: var(--fill); color: var(--ink); border: 1px solid var(--line); }
.btn.gemb { background: linear-gradient(180deg, #7aeeff, #2fb7e0); color: #00222c; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn .dot { width: 12px; height: 12px; }
.skins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.skin { border-radius: 18px; background: var(--fill); border: 1.5px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; position: relative; min-width: 0; }
.skin.sel { border-color: var(--accent); background: rgba(255,210,63,0.08); }
.skin canvas { width: 100%; height: 108px; display: block; border-radius: 12px; background: radial-gradient(circle at 50% 80%, rgba(255,255,255,0.1), rgba(255,255,255,0) 70%); }
.skin .nm { font-weight: 800; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.skin .rar { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.skin .btn { justify-content: center; }
.r0 { color: var(--r0); } .r1 { color: var(--r1); } .r2 { color: var(--r2); } .r3 { color: var(--r3); }
.case { border-radius: 20px; padding: 16px; border: 1.5px solid var(--line); background: var(--fill); display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: center; }
.crate { width: 76px; height: 70px; border-radius: 12px; position: relative; background: linear-gradient(180deg, var(--cc), #0d1226 140%); border: 2px solid var(--cc); box-shadow: 0 0 24px -4px var(--cc); }
.crate::before { content: ""; position: absolute; left: -4px; right: -4px; top: 14px; height: 10px; background: rgba(0,0,0,0.35); border-top: 2px solid var(--cc); }
.crate::after { content: ""; position: absolute; left: 50%; top: 8px; width: 16px; height: 22px; margin-left: -8px; border-radius: 4px; background: var(--accent); }
.case h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 18px; }
.case p { margin: 4px 0 10px; font-size: 12px; color: var(--dim); line-height: 1.4; }
.case .odds { font-size: 11px; color: var(--dim); margin-top: 8px; line-height: 1.4; }
.case .odds b { color: var(--ink); }
.set { display: flex; flex-direction: column; border-radius: 18px; background: var(--fill); border: 1px solid var(--line); }
.set > div { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); }
.set > div:first-child { border-top: 0; }
.set .line { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.set .nm { font-weight: 800; font-size: 15px; }
.set .ds { color: var(--dim); font-size: 12px; margin-top: 2px; }
.sw { position: relative; width: 52px; height: 30px; border-radius: 99px; background: rgba(255,255,255,0.14); border: 0; padding: 0; flex: none; transition: background 0.15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(22px); background: #241a00; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 28px; margin: 0; touch-action: none; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.seg button { padding: 10px 4px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1.5px solid var(--line); font-weight: 800; font-size: 13px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,210,63,0.14); }
.danger-zone .btn { background: rgba(255, 59, 78, 0.16); color: #ff8b97; border: 1px solid rgba(255,59,78,0.5); justify-content: center; }
.about { color: var(--dim); font-size: 12px; line-height: 1.5; text-align: center; margin: 0; }

/* overlays */
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(6, 8, 18, 0.72); padding-inline: max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
.card { background: var(--solid); border: 1px solid var(--line); border-radius: 24px; padding: 24px; text-align: center; width: 100%; max-width: 340px; box-sizing: border-box; }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0 0 6px; }
.card p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.45; }
.big { font-family: var(--display); font-size: 60px; line-height: 1.05; color: var(--accent); margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.big small { font-size: 0.35em; color: var(--dim); margin-left: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.stat { padding: 10px 4px; border-radius: 14px; background: var(--fill); font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 3px; align-items: center; }
.stat span { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.newbest { color: var(--accent); font-weight: 800; font-size: 14px; margin-top: 2px; }
.cbtns { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.cbtns .play { font-size: 20px; padding: 15px; }
.cbtns .alt { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 16px; padding: 14px; font-weight: 800; font-size: 15px; }
.rbox { height: 150px; display: grid; place-items: center; }
.rbox .crate { width: 100px; height: 92px; animation: shake 0.16s linear infinite; }
.rbox canvas { width: 150px; height: 150px; }
.rbox .ico.lg { width: 84px; height: 84px; padding: 20px; box-sizing: border-box; border-radius: 24px; background: rgba(255,255,255,0.07); color: var(--accent); }
.rbox .bigcoin { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, var(--coin) 55%, #c98a00); }
.rname { font-family: var(--display); font-size: 24px; margin: 8px 0 2px; }
.rcard { border-radius: 24px; padding: 24px; width: 100%; max-width: 340px; box-sizing: border-box; text-align: center; background: var(--solid); border: 2px solid var(--rc, var(--line)); box-shadow: 0 0 60px -10px var(--rc, transparent); }
@keyframes shake { 0% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(-3px, 1px) rotate(-3deg); } 50% { transform: translate(2px, -2px) rotate(2deg); } 75% { transform: translate(-2px, 2px) rotate(-2deg); } 100% { transform: translate(0, 0) rotate(0); } }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
.rcard.pop { animation: pop 0.35s ease-out; }
.rotate { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; text-align: center; background: var(--bg); padding: 24px; font-family: var(--display); font-size: 20px; line-height: 1.4; }
@media (orientation: landscape) and (max-height: 520px) { .rotate { display: flex; } }
.toast { position: absolute; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--solid); border: 1px solid var(--line); padding: 11px 18px; border-radius: 99px; font-weight: 800; font-size: 14px; pointer-events: none; max-width: calc(100% - 32px); text-align: center; z-index: 5; }
@media (prefers-reduced-motion: reduce) { .rbox .crate { animation: none; } .rcard.pop { animation: none; } }
</style>

</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hud-row">
      <div>
        <div class="h-score"><span id="h-score">0</span><small>м</small></div>
        <div class="h-best" id="h-best"></div>
      </div>
      <div class="hud-cur">
        <button class="pausebtn" data-act="pause" type="button" aria-label="Пауза"><i></i></button>
        <span class="cn"><i class="dot coin"></i><span id="h-coins">0</span></span>
        <span class="cn"><i class="dot gem"></i><span id="h-gems">0</span></span>
      </div>
    </div>
    <div class="danger"><span>Погоня</span><div><i id="h-danger"></i></div></div>
    <div class="fx" id="h-fx"></div>
  </div>

  <div id="ui"></div>

  <div class="overlay" id="pause" hidden>
    <div class="card">
      <h2>Пауза</h2>
      <p>Агенты тоже стоят и ждут.</p>
      <div class="cbtns">
        <button class="play" data-act="resume" type="button">Продолжить</button>
        <button class="alt" data-act="quit" type="button">Закончить забег</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="card" id="overcard"></div>
  </div>

  <div class="overlay" id="reveal" hidden>
    <div class="rcard" id="rcard"></div>
  </div>

  <div class="rotate" id="rotate">Поверни телефон вертикально, так играть удобнее</div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'nochnoj-pobeg-v1';

  /* ================= data ================= */
  var ICON = {
    bolt: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="currentColor"/></svg>',
    shield: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5z" fill="currentColor"/></svg>',
    magnet: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v8a7 7 0 0 0 14 0V3h-4.5v8a2.5 2.5 0 0 1-5 0V3z" fill="currentColor"/></svg>',
    x2: '<span class="x2">x2</span>'
  };
  function ico(k, cls) { return '<span class="ico ' + (cls || '') + '">' + ICON[k] + '</span>'; }

  var BOOSTS = {
    dash: { n: 'Рывок', d: '6 секунд ускорения. Преграды сносишь без потерь.', p: 180, ic: 'bolt' },
    shield: { n: 'Щит', d: 'Один удар не считается.', p: 150, ic: 'shield' },
    magnet: { n: 'Магнит', d: '12 секунд притягивает монеты и кристаллы.', p: 120, ic: 'magnet' },
    dbl: { n: 'Двойной куш', d: 'Монеты удваиваются на весь забег.', p: 220, ic: 'x2' }
  };
  var BKEYS = ['dash', 'shield', 'magnet', 'dbl'];

  var RAR = ['Обычный', 'Редкий', 'Эпический', 'Легендарный'];
  var RCOL = ['#9aa3c7', '#4da3ff', '#b66bff', '#ffb02e'];
  var DUP = [60, 160, 420, 1000];

  var SKINS = [
    { id: 'stream', n: 'Стример', r: 0, p: 0, hood: '#ff7a3d', pants: '#2b3358', skin: '#f1c9a5', hat: 'cap', hatC: '#f2f4ff', acc: '#ffd23f' },
    { id: 'night', n: 'Ночной', r: 0, p: 250, hood: '#4b3fb3', pants: '#1c1f3d', skin: '#e8b998', hat: 'beanie', hatC: '#6a5cff', acc: '#cfc8ff' },
    { id: 'lime', n: 'Лайм', r: 1, p: 500, hood: '#8bd13f', pants: '#2c3a24', skin: '#f1c9a5', hat: 'cap', hatC: '#e8ff9a', acc: '#2c3a24' },
    { id: 'berry', n: 'Ягода', r: 1, p: 800, hood: '#ff4f9a', pants: '#4a1f45', skin: '#d9a77f', hat: 'beanie', hatC: '#ffd1e6', acc: '#fff' },
    { id: 'gold', n: 'Золотой', r: 2, p: 2500, hood: '#ffc928', pants: '#7a5a10', skin: '#f1c9a5', hat: 'cap', hatC: '#fff1a8', acc: '#fff' },

      ctx.fillStyle = 'hsl(250 40% ' + (14 + hash(i) * 6) + '%)';

    }

    var segL = 150;
    var base = Math.floor(dist / segL), off = dist - base * segL;
    for (i = 12; i >= 0; i--) {
      var z = i * segL - off;
      if (z < -80) continue;
      s = sOf(z); y = yOf(s);
      var c = cityKey[(base + i) % 64];
      var cc = cityKey[(base + i + 31) % 64];
      var alpha = Math.min(1, (s - 0.12) / 0.1);
      if (alpha <= 0) continue;

      [[-1, c], [1, cc]].forEach(function (pr) {
        var sg = pr[0], b = pr[1];

        var left = Math.min(x0, x1), bwid = Math.abs(x1 - x0), bh2 = b.h * PU * s;
        ctx.fillStyle = 'hsl(' + b.hue + ' 38% ' + (12 + b.win * 5) + '%)';
        ctx.fillRect(left, y - bh2, bwid, bh2 + 1);
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(left, y - bh2, bwid, Math.max(1, 3 * s));
        if (!SV.set.lite && s > 0.2) {
          var cols = 3, rows = Math.floor(b.h / 38);
          for (var rr1 = 0; rr1 < rows; rr1++) for (var cc1 = 0; cc1 < cols; cc1++) {

              ctx.fillRect(left + bwid * (0.12 + cc1 * 0.3), y - bh2 + (rr1 * 38 + 14) * PU * s, bwid * 0.16, 14 * PU * s);
            }

    var road = ctx.createLinearGradient(0, YH, 0, H);

    ctx.fillStyle = road;

    ctx.moveTo(xOf(-1.5, sT), yOf(sT)); ctx.lineTo(xOf(1.5, sT), yOf(sT));
    ctx.lineTo(xOf(1.5, sB), yOf(sB)); ctx.lineTo(xOf(-1.5, sB), yOf(sB)); ctx.closePath(); ctx.fill();

      var za = i * strip - so, zb = za + strip;

      var own = !!SV.owned[s.id], on = SV.skin === s.id, btn;
      if (on) btn = '<button class="btn alt" type="button" disabled>Выбран</button>';
      else if (own) btn = '<button class="btn" type="button" data-act="eq" data-id="' + s.id + '">Выбрать</button>';
      else if (s.p < 0) btn = '<button class="btn alt" type="button" disabled>Только из кейсов</button>';
      else btn = '<button class="btn" type="button" data-act="bs" data-id="' + s.id + '"' + (SV.coins < s.p ? ' disabled' : '') + '><i class="dot coin"></i>' + fmt(s.p) + '</button>';
      return '<div class="skin' + (on ? ' sel' : '') + '"><canvas data-skin="' + s.id + '" width="240" height="216"></canvas>' +
        '<div class="nm"><span>' + s.n + '</span><span class="rar r' + s.r + '">' + RAR[s.r] + '</span></div>' + btn + '</div>';
    }).join('');
    return '<section class="screen sub">' + head('Магазин') +
      '<div class="scroll"><div class="inner"><div><p class="label">Бусты на забег</p><div class="list">' + bl + '</div></div>' +
      '<div><p class="label">Герои</p><div class="skins">' + sl + '</div></div></div></div></section>';
  }

  function oddsText(c) {
    var tot = 0, k;
    for (k in c.w) tot += c.w[k];
    function pc(v) { return (v / tot * 100).toFixed(v / tot < 0.1 ? 1 : 0) + '%'; }
    return 'Шансы: монеты <b>' + pc(c.w.coins) + '</b>, бусты <b>' + pc(c.w.boost) + '</b>, обычный <b>' + pc(c.w.s0) + '</b>, редкий <b>' + pc(c.w.s1) + '</b>, эпический <b>' + pc(c.w.s2) + '</b>, легендарный <b>' + pc(c.w.s3) + '</b>.';
  }
  function casesHtml() {
    var cl = CASES.map(function (c) {
      return '<div class="case" style="--cc:' + c.col + '"><div class="crate"></div><div><h3>' + c.n + '</h3><p>' + c.d + '</p>' +
        '<button class="btn gemb" type="button" data-act="oc" data-id="' + c.id + '"' + (SV.gems < c.p ? ' disabled' : '') + '><i class="dot gem"></i>' + c.p + ' Открыть</button>' +
        '<div class="odds">' + oddsText(c) + '</div></div></div>';
    }).join('');
    return '<section class="screen sub">' + head('Кейсы') +
      '<div class="scroll"><div class="inner"><p class="about" style="text-align:left">Кристаллы лежат на дороге. Одного кристалла за минуту бега обычно хватает, чтобы накопить на кейс за пару забегов.</p>' + cl + '</div></div></section>';
  }

  function sw(key, name, desc) {
    return '<div class="line"><div><div class="nm">' + name + '</div>' + (desc ? '<div class="ds">' + desc + '</div>' : '') + '</div>' +
      '<button class="sw" type="button" role="switch" aria-label="' + name + '" aria-checked="' + SV.set[key] + '" data-act="sw" data-id="' + key + '"></button></div>';
  }
  function slider(key, name) {
    return '<div><div class="line"><div class="nm">' + name + '</div><span class="ds" id="v-' + key + '">' + SV.set[key] + '%</span></div>' +
      '<input id="s-' + key + '" type="range" min="0" max="100" step="5" value="' + SV.set[key] + '" data-slider="' + key + '"></div>';
  }
  function settingsHtml() {
    var sens = ['Низкая', 'Средняя', 'Высокая'].map(function (n, i) {
      return '<button type="button" data-act="sens" data-id="' + (i + 1) + '" aria-pressed="' + (SV.set.sens === i + 1) + '">' + n + '</button>';
    }).join('');
    return '<section class="screen sub">' + head('Настройки') +
      '<div class="scroll"><div class="inner">' +
      '<div><p class="label">Звук</p><div class="set"><div>' + sw('sfx', 'Звуки', 'Монеты, прыжки, удары') + slider('sfxVol', 'Громкость звуков') + '</div>' +
      '<div>' + sw('music', 'Музыка', 'Фоновый ритм') + slider('musVol', 'Громкость музыки') + '</div></div></div>' +
      '<div><p class="label">Управление</p><div class="set"><div><div class="line"><div><div class="nm">Чувствительность свайпа</div><div class="ds">Чем выше, тем короче свайп нужен</div></div></div><div class="seg">' + sens + '</div></div>' +
      '<div>' + sw('vib', 'Вибрация', 'Отклик на удары и кристаллы') + '</div></div></div>' +
      '<div><p class="label">Графика</p><div class="set"><div>' + sw('lite', 'Лёгкий режим', 'Меньше частиц и подсветки, если игра тормозит') + '</div></div></div>' +
      '<div><p class="label">Данные</p><div class="set danger-zone"><div><button class="btn" type="button" data-act="reset">' + (resetArmed ? 'Точно сбросить? Нажми ещё раз' : 'Сбросить весь прогресс') + '</button></div></div></div>' +
      '<p class="about">Свайп вверх: прыжок. Свайп вниз: подкат. Влево и вправо: сменить полосу. На компьютере: стрелки или WASD.</p>' +
      '</div></div></section>';
  }

  function drawSkinPreviews() {
    var cs = ui.querySelectorAll('canvas[data-skin]');
    for (var i = 0; i < cs.length; i++) {
      var c = cs[i], g = c.getContext('2d');
      g.clearRect(0, 0, c.width, c.height);
      var sk = skinById(c.getAttribute('data-skin'));
      g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(c.width / 2, c.height - 14, 34, 8, 0, 0, 6.2832); g.fill();
      figure(g, c.width / 2, c.height - 16, c.height * 0.8, sk, 0.6, false, false);
    }
  }

  function render() {
    var sc = ui.querySelector('.scroll');
    var top = sc ? sc.scrollTop : 0;
    var html = screen === 'home' ? homeHtml() : screen === 'shop' ? shopHtml() : screen === 'cases' ? casesHtml() : settingsHtml();
    ui.innerHTML = html;
    var sc2 = ui.querySelector('.scroll');
    if (sc2) sc2.scrollTop = top;
    if (screen === 'shop') drawSkinPreviews();
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast.tm);
    toast.tm = setTimeout(function () { t.hidden = true; }, 1800);
  }

  /* ---------- cases ---------- */
  function pickPrize(c) {
    var tot = 0, k, r;
    for (k in c.w) tot += c.w[k];
    r = Math.random() * tot;
    var key = 'coins';
    for (k in c.w) { r -= c.w[k]; if (r <= 0) { key = k; break; } }
    if (key === 'coins') return { t: 'coins', n: rint(c.coin[0], c.coin[1]) };
    if (key === 'boost') return { t: 'boost', id: BKEYS[rint(0, BKEYS.length - 1)], n: c.qty };
    var rar = parseInt(key.charAt(1), 10);
    var pool = SKINS.filter(function (s) { return s.r === rar; });
    var s = pool[rint(0, pool.length - 1)];
    if (SV.owned[s.id]) return { t: 'dup', id: s.id, n: DUP[rar] };
    return { t: 'skin', id: s.id };
  }
  function openCase(id) {
    if (busy) return;
    var c = CASES.filter(function (x) { return x.id === id; })[0];
    if (!c || SV.gems < c.p) return;
    busy = true;
    unlock();
    SV.gems -= c.p;
    var prize = pickPrize(c);
    if (prize.t === 'coins' || prize.t === 'dup') SV.coins += prize.n;
    else if (prize.t === 'boost') SV.boosts[prize.id] += prize.n;
    else if (prize.t === 'skin') SV.owned[prize.id] = true;
    persist();
    var rc = document.getElementById('rcard');
    rc.className = 'rcard'; rc.style.removeProperty('--rc');
    rc.innerHTML = '<div class="rbox"><div class="crate" style="--cc:' + c.col + '"></div></div><div class="rname">Открываем…</div><p>' + c.n + '</p>';
    document.getElementById('reveal').hidden = false;
    sfx('click');
    var i = 0;
    var tick = setInterval(function () { tone(180 + (i++) * 25, 0.07, 'square', 0.06); }, 150);
    setTimeout(function () {
      clearInterval(tick);
      showPrize(prize, c);
    }, 1400);
  }
  function showPrize(p, c) {
    var rc = document.getElementById('rcard');
    var col = '#9aa3c7', title = '', sub = '', vis = '', rarity = 0;
    if (p.t === 'coins') { col = '#ffc928'; title = '+' + fmt(p.n) + ' монет'; sub = 'Деньги на скины и бусты'; vis = '<div class="bigcoin"></div>'; }
    else if (p.t === 'boost') { col = '#ffd23f'; title = BOOSTS[p.id].n + ' ×' + p.n; sub = BOOSTS[p.id].d; vis = ico(BOOSTS[p.id].ic, 'lg'); }
    else {
      var sk = skinById(p.id); rarity = sk.r; col = RCOL[sk.r];
      title = sk.n; sub = RAR[sk.r] + ' герой' + (p.t === 'dup' ? '. Уже есть, поэтому +' + fmt(p.n) + ' монет' : '. Добавлен в магазин');
      vis = '<canvas id="prz" width="300" height="300"></canvas>';
    }
    if (p.t === 'coins' || p.t === 'boost') rarity = 1;
    rc.style.setProperty('--rc', col);
    rc.className = 'rcard pop';
    rc.innerHTML = '<div class="rbox">' + vis + '</div><div class="rname" style="color:' + col + '">' + title + '</div><p>' + sub + '</p>' +
      '<div class="cbtns"><button class="play" data-act="rclose" type="button">Забрать</button>' +
      (SV.gems >= c.p ? '<button class="alt" data-act="oc" data-id="' + c.id + '" type="button">Открыть ещё за ' + c.p + '</button>' : '') + '</div>';
    var cv = document.getElementById('prz');
    if (cv) {
      var g = cv.getContext('2d');
      g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(150, 280, 50, 10, 0, 0, 6.2832); g.fill();
      figure(g, 150, 276, 240, skinById(p.id), 0.6, false, false);
    }
    if (rarity >= 2) { sfx('rare'); buzz(40); } else sfx('buy');
    busy = false;
  }

  /* ---------- actions ---------- */
  function act(a, id, el) {
    unlock();
    switch (a) {
      case 'play': sfx('click'); startRun(); break;
      case 'again': startRun(); break;
      case 'home': sfx('click'); goHome(); break;
      case 'go': sfx('click'); screen = id; resetArmed = false; render(); break;
      case 'back': sfx('click'); screen = 'home'; resetArmed = false; render(); break;
      case 'tb': sel[id] = !sel[id]; sfx('click'); render(); break;
      case 'gift':
        SV.daily = todayStr(); SV.coins += 60; SV.gems += 1; persist(); sfx('gem'); toast('+60 монет и +1 кристалл'); render(); break;
      case 'bb':
        if (SV.coins >= BOOSTS[id].p) { SV.coins -= BOOSTS[id].p; SV.boosts[id]++; persist(); sfx('buy'); render(); }
        break;
      case 'bs':
        var s = skinById(id);
        if (s.p > 0 && SV.coins >= s.p && !SV.owned[id]) { SV.coins -= s.p; SV.owned[id] = true; SV.skin = id; persist(); sfx('buy'); toast(s.n + ' куплен'); render(); }
        break;
      case 'eq': if (SV.owned[id]) { SV.skin = id; persist(); sfx('click'); render(); } break;
      case 'oc': document.getElementById('reveal').hidden = true; openCase(id); break;
      case 'rclose': document.getElementById('reveal').hidden = true; render(); break;
      case 'sw':
        SV.set[id] = !SV.set[id]; persist(); applyVol(); if (id === 'sfx' && SV.set.sfx) sfx('click'); render(); break;
      case 'sens': SV.set.sens = parseInt(id, 10); persist(); sfx('click'); render(); break;
      case 'reset':
        if (!resetArmed) { resetArmed = true; render(); }
        else { var keepSet = SV.set; SV = defSave(); SV.set = keepSet; resetArmed = false; sel = {}; persist(); toast('Прогресс сброшен'); render(); }
        break;
      case 'pause': pauseGame(); break;
      case 'resume': resumeGame(); break;
      case 'quit': document.getElementById('pause').hidden = true; endRun(false); break;
    }
  }
  stage.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || t.disabled) return;
    act(t.getAttribute('data-act'), t.getAttribute('data-id'), t);
  });
  stage.addEventListener('input', function (e) {
    var k = e.target && e.target.getAttribute ? e.target.getAttribute('data-slider') : null;
    if (!k) return;
    SV.set[k] = parseInt(e.target.value, 10);
    document.getElementById('v-' + k).textContent = SV.set[k] + '%';
    applyVol();
  });
  stage.addEventListener('change', function (e) {
    var k = e.target && e.target.getAttribute ? e.target.getAttribute('data-slider') : null;
    if (!k) return;
    persist();
    if (k === 'sfxVol') sfx('coin');
  });

  function pauseGame() {
    if (mode !== 'play') return;
    mode = 'paused';
    document.getElementById('pause').hidden = false;
  }
  function resumeGame() {
    if (mode !== 'paused') return;
    document.getElementById('pause').hidden = true;
    mode = 'play';
    inv = Math.max(inv, 0.8);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { pauseGame(); if (ac && ac.state === 'running') ac.suspend(); }
    else if (ac && ac.state === 'suspended') ac.resume();
  });

  /* ---------- input ---------- */
  var sx = 0, sy = 0, sid = null;
  function thr() { return [36, 24, 14][SV.set.sens - 1] || 24; }
  canvas.addEventListener('pointerdown', function (e) {
    unlock();
    if (mode !== 'play') return;
    e.preventDefault();
    sid = e.pointerId; sx = e.clientX; sy = e.clientY;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (sid === null || e.pointerId !== sid || mode !== 'play') return;
    var dx = e.clientX - sx, dy = e.clientY - sy, t = thr();
    if (Math.max(Math.abs(dx), Math.abs(dy)) < t) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1);
    else if (dy < 0) jump(); else slide();
    sx = e.clientX; sy = e.clientY;
  });
  function endPtr(e) { if (e.pointerId === sid) sid = null; }
  canvas.addEventListener('pointerup', endPtr);
  canvas.addEventListener('pointercancel', endPtr);
  window.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT')) return;
    var c = e.code;
    if (c === 'ArrowLeft' || c === 'KeyA') { e.preventDefault(); move(-1); }
    else if (c === 'ArrowRight' || c === 'KeyD') { e.preventDefault(); move(1); }
    else if (c === 'ArrowUp' || c === 'KeyW' || c === 'Space') { e.preventDefault(); jump(); }
    else if (c === 'ArrowDown' || c === 'KeyS') { e.preventDefault(); slide(); }
    else if (c === 'Escape' || c === 'KeyP') { if (mode === 'play') pauseGame(); else if (mode === 'paused') resumeGame(); }
  });

  /* ================= phone helpers ================= */
  var wake = null;
  function lockScreen() {
    try {
      if (navigator.wakeLock && !wake) {
        navigator.wakeLock.request('screen').then(function (l) {
          wake = l;
          l.addEventListener('release', function () { wake = null; });
        }).catch(function () {});
      }
    } catch (e) {}
  }
  function unlockScreen() { try { if (wake) { wake.release(); wake = null; } } catch (e) {} }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && mode === 'play') lockScreen(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  try {
    var mq = window.matchMedia('(orientation: landscape) and (max-height: 520px)');
    var onMq = function () { if (mq.matches) pauseGame(); };
    if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
  } catch (e) {}
  var fpsAcc = 0, fpsN = 0, lagWarned = false;
  function watchFps(dt) {
    if (mode !== 'play' || SV.set.lite || lagWarned) { fpsAcc = 0; fpsN = 0; return; }
    fpsAcc += dt; fpsN++;
    if (fpsN >= 120) {
      if (fpsAcc / fpsN > 0.028) { SV.set.lite = true; lagWarned = true; persist(); toast('Включён лёгкий режим, чтобы не тормозило'); }
      fpsAcc = 0; fpsN = 0;
    }
  }

  /* ================= loop ================= */
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  resetRun(); gap = 6;
  resize();
  render();

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    watchFps(dt);
    update(dt);
    draw();
    updateHud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__pobeg = { start: startRun, state: function () { return { mode: mode, dist: runDist, gap: gap, ents: ents.length }; } };
})();
</script>

</body>
